name: Long Short Regime Families V1

on:
  push:
    branches: ['agent/live-paper-hardening']
    paths: ['research_triggers/long_short_regime_families_v1.txt']

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  regime-families:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-paper-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and verify causal invariants
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m py_compile scripts/run_long_short_regime_families_v1.py
          python -m strategy_lab.causal_history_fast_smoke_test
          python -m strategy_lab.closed_context_smoke_test
          python -m strategy_lab.walk_forward_boundary_smoke_test
          python -m strategy_lab.research_metrics_smoke_test
          python -m strategy_lab.causal_regime_families_smoke_test
      - name: Download fixed official Binance Futures history
        run: |
          python scripts/download_binance_vision_futures_archives.py \
            --symbols-file results/twelve_month_dual_screening_universe_v1/combined_symbols.txt \
            --interval 15m --start-date '2025-01-01' --end-date '2026-06-30' \
            --out-dir "$RUNNER_TEMP/binance-vision-regime-v1" \
            --summary-json results/long_short_regime_families_v1/archive_download_summary.json \
            --workers 8 --retries 2 --timeout 30
      - name: Merge and verify closed candles
        run: |
          python scripts/merge_binance_vision_futures_klines.py \
            --input-dir "$RUNNER_TEMP/binance-vision-regime-v1" \
            --out "$RUNNER_TEMP/smoke-regime-v1-15m.csv" \
            --symbols-file results/twelve_month_dual_screening_universe_v1/combined_symbols.txt \
            --interval 15m --start-date '2025-01-01' --end-date '2026-06-30' \
            --summary-json results/long_short_regime_families_v1/archive_merge_summary.json \
            --min-coverage 0.65
      - name: Run strict OOS regime families
        run: |
          python scripts/run_long_short_regime_families_v1.py \
            --candles "$RUNNER_TEMP/smoke-regime-v1-15m.csv" \
            --out-dir results/long_short_regime_families_v1 \
            --windows 10 --lookback-days 30 --profile research_500 --pool-min-confidence 40
      - name: Upload audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-long-short-regime-families-v1
          path: |
            results/long_short_regime_families_v1/**
            research/long_short_regime_families_v1.json
          if-no-files-found: warn
      - name: Commit compact result and status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/live-paper-hardening
          mkdir -p results/long_short_regime_families_status_v1
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('results/long_short_regime_families_status_v1/monitor.json').write_text(json.dumps({
            'run_id': int(os.environ['GITHUB_RUN_ID']), 'source_head_sha': os.environ['GITHUB_SHA'],
            'status': '${{ job.status }}', 'period': '2025-01-01 through 2026-06-30',
            'mode': 'LONG_SHORT_REGIME_FAMILIES_V1'}, indent=2) + '\n', encoding='utf-8')
          PY
          git add results/long_short_regime_families_status_v1/monitor.json
          for file in result.json candidate_summary.csv archive_download_summary.json archive_merge_summary.json; do
            test -f "results/long_short_regime_families_v1/$file" && git add "results/long_short_regime_families_v1/$file"
          done
          test -d results/long_short_regime_families_v1/candidate_folds && git add results/long_short_regime_families_v1/candidate_folds
          git commit -m 'Record long short regime family result' || exit 0
          git push origin HEAD:agent/live-paper-hardening
