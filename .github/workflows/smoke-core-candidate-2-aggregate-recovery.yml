name: SMOKE CORE Candidate 2 Aggregate Recovery

on:
  pull_request:
    branches:
      - agent/smoke-core-1-p8-semantic-freeze
    paths:
      - '.github/workflows/smoke-core-candidate-2-aggregate-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: smoke-core-candidate-2-aggregate-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  aggregate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .

      - name: Download completed baseline shards 0-27
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-2-causal-replay-*
          path: research_outputs/baseline
          merge-multiple: true
          repository: SanChi117/Smoke-strategy
          run-id: '31944319793'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep only authoritative baseline segments 0-27
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('research_outputs/baseline')
          for p in root.rglob('candidate_2_replay_*.json'):
              try:
                  idx = int(p.stem.rsplit('_', 1)[1])
              except Exception:
                  continue
              if idx >= 28:
                  p.unlink()
          PY

      - name: Download recovered logical tail 28-31 from Tail Recovery
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-2-tail-logical-*
          path: research_outputs/recovered_tail
          merge-multiple: true
          repository: SanChi117/Smoke-strategy
          run-id: '32368506731'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact 160-shard grid before aggregation
        run: |
          mkdir -p research_outputs/assembled
          cp research_outputs/baseline/candidate_2_replay_*.json research_outputs/assembled/
          cp research_outputs/recovered_tail/candidate_2_replay_*.json research_outputs/assembled/
          python - <<'PY'
          import json
          from pathlib import Path
          symbols={'BTCUSDT','ETHUSDT','SOLUSDT','LINKUSDT','AAVEUSDT'}
          root=Path('research_outputs/assembled')
          files=sorted(root.glob('candidate_2_replay_*.json'))
          seen=[]
          for p in files:
              d=json.loads(p.read_text())
              seen.append((d['symbol'], int(d['segment_index']), int(d['segment_count'])))
          assert len(files)==160, f'expected 160 files, got {len(files)}'
          assert len(set(seen))==160, 'duplicate symbol/segment payloads'
          assert {x[0] for x in seen}==symbols, f'symbol coverage mismatch: {sorted({x[0] for x in seen})}'
          assert {x[2] for x in seen}=={32}, f'segment_count mismatch: {sorted({x[2] for x in seen})}'
          expected={(s,i,32) for s in symbols for i in range(32)}
          actual=set(seen)
          assert actual==expected, f'grid mismatch missing={sorted(expected-actual)[:20]} extra={sorted(actual-expected)[:20]}'
          print('C2 aggregate recovery grid: 160/160 OK')
          PY

      - name: Aggregate without recomputing causal replay
        run: |
          python -u strategy_lab/candidate_2_dynamic_checkpoint_aggregate_v1.py \
            --input-dir research_outputs/assembled \
            --output research_outputs/candidate_2_full_causal_replay_v1.json

      - name: Audit final outcome-blind artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research_outputs/candidate_2_full_causal_replay_v1.json')
          r=json.loads(p.read_text())
          assert r['purpose']=='CAUSAL_REPLAY_DEBUG_ONLY_NOT_PROFITABILITY'
          assert r['physical_shard_count']==160
          assert r['segments_per_symbol']==32
          assert r['semantic_clean'] is True
          q=r['recognition']
          assert q['duplicate_rows']==0
          assert q['forbidden_rows']==0
          assert q['missing_provenance_rows']==0
          assert q['invalid_lifecycle_rows']==0
          assert q['reproducible'] is True
          assert set(q['by_symbol'])=={'BTCUSDT','ETHUSDT','SOLUSDT','LINKUSDT','AAVEUSDT'}
          assert set(q['by_direction'])=={'LONG','SHORT'}
          print(json.dumps({
              'independent_entry_ready': q['independent_entry_ready'],
              'by_symbol': q['by_symbol'],
              'by_direction': q['by_direction'],
              'fold_count': len(q['by_fold']),
              'fingerprint_digest_sha256': r['fingerprint_digest_sha256'],
          }, sort_keys=True))
          PY

      - name: Upload final recovered causal artifact
        uses: actions/upload-artifact@v4
        with:
          name: smoke-core-candidate-2-full-causal-replay-v1-aggregate-recovered
          path: research_outputs/candidate_2_full_causal_replay_v1.json
          if-no-files-found: error
          retention-days: 90
