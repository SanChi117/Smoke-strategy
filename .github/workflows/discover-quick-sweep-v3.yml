name: Discover Quick Sweep V3

on:
  push:
    branches:
      - 'agent/live-paper-hardening'
    paths:
      - 'research_triggers/discover_quick_sweep_v3.txt'

permissions:
  actions: read
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 83b61d1c785f6bb4d46c85ad4aee36971d1ebf54
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-paper-hardening
          fetch-depth: 0
      - name: Find resumption sweep
        run: |
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow causal-quick-sweep.yml --event push --branch agent/live-paper-hardening --limit 20 --json databaseId,headSha --jq '.[] | select(.headSha == env.TARGET_SHA) | .databaseId' | head -n 1)"
          test -n "$RUN_ID"
          mkdir -p results/causal_quick_sweep_status_v3
          python - <<PY
          import json
          from pathlib import Path
          Path('results/causal_quick_sweep_status_v3/monitor.json').write_text(json.dumps({'source_head_sha':'$TARGET_SHA','run_id':int('$RUN_ID')}, indent=2)+'\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin agent/live-paper-hardening
          git add results/causal_quick_sweep_status_v3/monitor.json
          git commit -m "Record pullback resumption sweep run id" || exit 0
          git push origin HEAD:agent/live-paper-hardening
