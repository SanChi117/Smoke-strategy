name: Collect Quick Sweep V3

on:
  push:
    branches:
      - 'agent/live-paper-hardening'
    paths:
      - 'research_triggers/collect_quick_sweep_v3.txt'

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '29410024555'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-paper-hardening
          fetch-depth: 0

      - name: Download completed quick sweep
        id: download
        continue-on-error: true
        run: |
          rm -rf collected
          mkdir -p collected
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name smoke-causal-quick-sweep-v1 \
            --dir collected

      - name: Save workflow log
        if: always()
        run: |
          gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log > collected/run.log

      - name: Build compact result
        if: always()
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv
          import json
          from pathlib import Path

          root = Path('collected')
          out = Path('results/causal_quick_sweep_status_v3')
          out.mkdir(parents=True, exist_ok=True)

          def find(name: str):
              matches = list(root.rglob(name)) if root.exists() else []
              return matches[0] if matches else None

          def load_json(name: str):
              path = find(name)
              if not path or path.stat().st_size == 0:
                  return {}, None
              try:
                  return json.loads(path.read_text(encoding='utf-8')), path
              except Exception:
                  return {}, path

          def read_csv_rows(name: str):
              path = find(name)
              if not path or path.stat().st_size == 0:
                  return [], None
              with path.open(newline='', encoding='utf-8') as f:
                  return list(csv.DictReader(f)), path

          best, best_path = load_json('tagged_multi_wfo_best.json')
          summary_rows, summary_path = read_csv_rows('tagged_multi_wfo_summary.csv')
          matrix_rows, matrix_path = read_csv_rows('matrix_summary.csv')
          log_path = root / 'run.log'
          log_text = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''

          result = {
              'source_run_id': int('29410024555'),
              'download_outcome': '${{ steps.download.outcome }}',
              'artifact_found': bool(best_path),
              'candidate': best.get('name', ''),
              'wfo_verdict': best.get('wfo_verdict', ''),
              'positive_folds': best.get('positive_folds', ''),
              'valid_folds': best.get('valid_folds', best.get('total_folds', '')),
              'total_trades': best.get('wfo_total_trades', ''),
              'avg_return_pct': best.get('wfo_avg_ret_pct', ''),
              'avg_pf': best.get('wfo_avg_pf', ''),
              'worst_dd_pct': best.get('wfo_worst_dd_pct', ''),
              'matrix_return_pct': best.get('matrix_ret_pct', ''),
              'matrix_pf': best.get('matrix_pf', ''),
              'matrix_trades': best.get('matrix_executed_trades', ''),
              'ranked_candidates': summary_rows,
              'matrix_candidates': matrix_rows,
              'files_found': {
                  'best': str(best_path or ''),
                  'summary': str(summary_path or ''),
                  'matrix': str(matrix_path or ''),
                  'log': str(log_path if log_path.exists() else ''),
              },
              'log_tail': '\n'.join(log_text.splitlines()[-120:]),
          }
          (out / 'result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          lines = [
              '# Causal quick sweep v3 result',
              '',
              f"- Source run: `{result['source_run_id']}`",
              f"- Artifact found: **{result['artifact_found']}**",
              f"- Candidate: **{result['candidate'] or 'not recovered'}**",
              f"- WFO verdict: **{result['wfo_verdict'] or 'not recovered'}**",
              f"- Positive folds: `{result['positive_folds']}/{result['valid_folds']}`",
              f"- Trades: `{result['total_trades']}`",
              f"- Average return: `{result['avg_return_pct']}`",
              f"- Average PF: `{result['avg_pf']}`",
              f"- Worst DD: `{result['worst_dd_pct']}`",
          ]
          (out / 'result.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit compact result
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/live-paper-hardening
          git add results/causal_quick_sweep_status_v3/result.json results/causal_quick_sweep_status_v3/result.md
          if git diff --cached --quiet; then
            echo 'No result changes'
            exit 0
          fi
          git commit -m 'Record causal quick sweep v3 result'
          git push origin HEAD:agent/live-paper-hardening
