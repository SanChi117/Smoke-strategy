name: SMOKE CORE P7 Incremental POI Adapter

on:
  pull_request:
    branches:
      - agent/smoke-core-1-p6-scenario-fusion
    paths:
      - 'strategy_lab/p7_incremental_poi_adapter_v1.py'
      - 'strategy_lab/p7_incremental_poi_adapter_v1_smoke_test.py'
      - 'strategy_lab/p7_full_recognition_entrypoint_v1.py'
      - 'strategy_lab/poi_imbalance_engine_v1.py'
      - 'strategy_lab/mtf_dealing_range_v2.py'
      - '.github/workflows/smoke-core-p7-incremental-poi-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-causal-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Compile incremental adapter
        run: |
          python -m py_compile \
            strategy_lab/p7_incremental_poi_adapter_v1.py \
            strategy_lab/p7_incremental_poi_adapter_v1_smoke_test.py \
            strategy_lab/p7_full_recognition_entrypoint_v1.py
      - name: Compare incremental adapter with frozen P1 at every closed bar
        run: python -u strategy_lab/p7_incremental_poi_adapter_v1_smoke_test.py
      - name: Re-run frozen P1 semantic regression
        run: python -u strategy_lab/poi_imbalance_engine_v1_smoke_test.py
