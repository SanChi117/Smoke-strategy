name: Causal Long History Sweep

on:
  push:
    branches:
      - 'agent/live-paper-hardening'
    paths:
      - 'research_triggers/causal_long_history_sweep_v1.txt'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  long-wfo:
    name: six-month-true-futures-causal-wfo
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-paper-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify causal invariants
        run: |
          python -m strategy_lab.causal_history_fast_smoke_test
          python -m strategy_lab.closed_context_smoke_test
          python -m strategy_lab.context_alignment_gate_smoke_test
          python -m strategy_lab.walk_forward_boundary_smoke_test
          python -m strategy_lab.walk_forward_funnel_smoke_test

      - name: Build dynamic research universe
        run: |
          python scripts/build_strategy_universe_layer.py \
            --top-n-per-group 3 \
            --out-dir results/causal_long_history_universe_v1

      - name: Run six-month cached causal WFO
        run: |
          python scripts/run_causal_long_history_sweep.py \
            --symbols-file results/causal_long_history_universe_v1/combined_symbols.txt \
            --out-dir results/causal_long_history_sweep_v1 \
            --interval 15m \
            --limit 18000 \
            --windows 6 \
            --lookback-days 30 \
            --profile research_500 \
            --pool-min-confidence 40 \
            --sleep-sec 0.02

      - name: Prepare compact audit result
        if: always()
        run: |
          rm -rf compact-long-wfo
          mkdir -p compact-long-wfo/results/causal_long_history_sweep_v1
          mkdir -p compact-long-wfo/results/causal_long_history_universe_v1
          cp -f results/causal_long_history_sweep_v1/result.json compact-long-wfo/results/causal_long_history_sweep_v1/ 2>/dev/null || true
          cp -f results/causal_long_history_sweep_v1/result.md compact-long-wfo/results/causal_long_history_sweep_v1/ 2>/dev/null || true
          cp -f results/causal_long_history_sweep_v1/long_wfo_summary.csv compact-long-wfo/results/causal_long_history_sweep_v1/ 2>/dev/null || true
          cp -f results/causal_long_history_sweep_v1/fold_index.csv compact-long-wfo/results/causal_long_history_sweep_v1/ 2>/dev/null || true
          cp -f results/causal_long_history_sweep_v1/market_data_summary.json compact-long-wfo/results/causal_long_history_sweep_v1/ 2>/dev/null || true
          cp -R results/causal_long_history_sweep_v1/candidate_folds compact-long-wfo/results/causal_long_history_sweep_v1/ 2>/dev/null || true
          cp -f results/causal_long_history_universe_v1/combined_symbols.txt compact-long-wfo/results/causal_long_history_universe_v1/ 2>/dev/null || true
          find results/causal_long_history_sweep_v1/folds -type f \
            \( -name 'walk_forward_layer_funnel.json' -o -name 'pipeline_summary.csv' \) \
            -print0 2>/dev/null | while IFS= read -r -d '' file; do
              destination="compact-long-wfo/$file"
              mkdir -p "$(dirname "$destination")"
              cp "$file" "$destination"
            done

      - name: Upload compact long WFO audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-causal-long-history-sweep-v1
          path: compact-long-wfo/**
          if-no-files-found: warn

      - name: Commit compact result to branch
        if: always()
        run: |
          if [ ! -f compact-long-wfo/results/causal_long_history_sweep_v1/result.json ]; then
            echo 'No final result to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/live-paper-hardening
          mkdir -p results
          cp -R compact-long-wfo/results/* results/
          git add results/causal_long_history_sweep_v1 results/causal_long_history_universe_v1
          git commit -m 'Record six-month causal WFO result' || exit 0
          git push origin HEAD:agent/live-paper-hardening
