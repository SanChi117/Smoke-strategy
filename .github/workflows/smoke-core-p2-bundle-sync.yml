name: SMOKE CORE P2 Bundle Sync

on:
  push:
    branches:
      - agent/smoke-core-1-p2-context-liquidity
    paths:
      - 'research_triggers/p2_context_liquidity_chunks/**'
      - '.github/workflows/smoke-core-p2-bundle-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/smoke-core-1-p2-context-liquidity
          fetch-depth: 0
      - name: Reconstruct and compile P2 engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p strategy_lab
          cat research_triggers/p2_context_liquidity_chunks/chunk_00.b64 \
              research_triggers/p2_context_liquidity_chunks/chunk_01.b64 \
              research_triggers/p2_context_liquidity_chunks/chunk_02.b64 \
            | tr -d '\n\r ' \
            | base64 --decode > strategy_lab/context_liquidity_engine_v1.py
          python -m py_compile strategy_lab/context_liquidity_engine_v1.py
      - name: Commit reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add strategy_lab/context_liquidity_engine_v1.py
          if git diff --cached --quiet; then
            echo 'P2 engine already synchronized.'
            exit 0
          fi
          git commit -m 'Synchronize P2 context liquidity engine source'
          git push origin HEAD:agent/smoke-core-1-p2-context-liquidity
