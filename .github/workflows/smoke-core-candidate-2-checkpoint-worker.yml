name: SMOKE CORE Candidate 2 Checkpoint Worker

on:
  workflow_call:
    inputs:
      symbol:
        required: true
        type: string
      segment:
        required: true
        type: number
      previous_segment:
        required: false
        type: number
        default: -1
      has_checkpoint:
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download frozen replay/debug dataset
        uses: actions/download-artifact@v4
        with:
          name: candidate-1-development-locked-data-v2
          path: research_outputs/p7_full_recognition_data_v1
          repository: SanChi117/Smoke-strategy
          run-id: '31130707800'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download authoritative P7 precomputed levels
        uses: actions/download-artifact@v4
        with:
          name: p7-full-recognition-levels-${{ inputs.symbol }}
          path: research_outputs/p7_levels
          repository: SanChi117/Smoke-strategy
          run-id: '30899050584'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download previous checkpoint
        if: inputs.has_checkpoint
        uses: actions/download-artifact@v4
        with:
          name: candidate-2-checkpoint-${{ inputs.symbol }}-${{ inputs.previous_segment }}
          path: research_outputs/candidate_2_checkpoint_in
      - name: Scan Candidate 2 from causal checkpoint
        env:
          P7_LEVELS_FILE: research_outputs/p7_levels/p7_levels_${{ inputs.symbol }}.pkl
          P7_LEVELS_SYMBOL: ${{ inputs.symbol }}
          HAS_CHECKPOINT: ${{ inputs.has_checkpoint }}
          PREVIOUS_SEGMENT: ${{ inputs.previous_segment }}
        run: |
          mkdir -p research_outputs/candidate_2_replay research_outputs/candidate_2_checkpoints
          EXTRA=""
          if [ "$HAS_CHECKPOINT" = "true" ]; then
            EXTRA="--checkpoint-in research_outputs/candidate_2_checkpoint_in/candidate_2_checkpoint_${{ inputs.symbol }}_${PREVIOUS_SEGMENT}.pkl"
          fi
          python -u strategy_lab/candidate_2_replay_shards_v1.py scan-segment \
            --symbol '${{ inputs.symbol }}' \
            --segment-index '${{ inputs.segment }}' \
            --segment-count 8 \
            --data-root research_outputs/p7_full_recognition_data_v1 \
            $EXTRA \
            --checkpoint-out research_outputs/candidate_2_checkpoints/candidate_2_checkpoint_${{ inputs.symbol }}_${{ inputs.segment }}.pkl \
            --output research_outputs/candidate_2_replay/candidate_2_replay_${{ inputs.symbol }}_${{ inputs.segment }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-2-causal-replay-${{ inputs.symbol }}-${{ inputs.segment }}
          path: research_outputs/candidate_2_replay/candidate_2_replay_${{ inputs.symbol }}_${{ inputs.segment }}.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-2-checkpoint-${{ inputs.symbol }}-${{ inputs.segment }}
          path: research_outputs/candidate_2_checkpoints/candidate_2_checkpoint_${{ inputs.symbol }}_${{ inputs.segment }}.pkl
          if-no-files-found: error
          retention-days: 90
