name: SMOKE MTF V2 Semantic Status Probe

on:
  push:
    branches: ['agent/smoke-mtf-dealing-range-v2']
    paths: ['research_triggers/smoke_mtf_v2_semantic_status_probe.txt']

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  probe-semantic-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe latest semantic replay and update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_SHA: '310b2e5d378fe140edcca5baf219cf7a72d660a8'
          PR_NUMBER: '2'
        run: |
          python - <<'PY'
          import io, json, os, urllib.request, zipfile
          marker = '<!-- smoke-mtf-v2-semantic-replay-status -->'
          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          sha = os.environ['TARGET_SHA']
          pr = os.environ['PR_NUMBER']
          def req(path, method='GET', payload=None):
              url = path if path.startswith('http') else f'https://api.github.com{path}'
              data = None if payload is None else json.dumps(payload).encode()
              r = urllib.request.Request(url, data=data, method=method)
              r.add_header('Authorization', f'Bearer {token}')
              r.add_header('Accept', 'application/vnd.github+json')
              r.add_header('X-GitHub-Api-Version', '2022-11-28')
              if data is not None: r.add_header('Content-Type','application/json')
              with urllib.request.urlopen(r, timeout=60) as x:
                  raw=x.read(); ct=x.headers.get('Content-Type','')
                  return json.loads(raw.decode()) if 'json' in ct else raw
          runs=req(f'/repos/{repo}/actions/runs?head_sha={sha}&per_page=100').get('workflow_runs',[])
          runs=[r for r in runs if r.get('name')=='SMOKE MTF V2 Semantic Replay V1']
          if not runs:
              body=f'{marker}\n## SMOKE MTF V2 — semantic replay\n\n- Target SHA: `{sha}`\n- Status: **RUN_NOT_FOUND**'
          else:
              run=max(runs,key=lambda r:int(r['id']))
              lines=[marker,'## SMOKE MTF V2 — semantic replay','',f"- Run: [{run['id']}]({run['html_url']})",f"- Status: **{run['status']} / {run.get('conclusion') or 'pending'}**"]
              if run.get('status')=='completed':
                  arts=req(f"/repos/{repo}/actions/runs/{run['id']}/artifacts?per_page=100").get('artifacts',[])
                  art=next((a for a in arts if a.get('name')=='smoke-mtf-v2-semantic-replay-v1' and not a.get('expired')),None)
                  if art:
                      raw=req(art['archive_download_url'])
                      with zipfile.ZipFile(io.BytesIO(raw)) as z:
                          names=z.namelist()
                          summary_name=next((n for n in names if n.endswith('summary.json')),None)
                          if summary_name:
                              s=json.loads(z.read(summary_name).decode())
                              lines += ['', '### Result', f"- Exact replay matches: **{s.get('exact_replay_matches')}**", f"- Exact replay mismatches: **{s.get('exact_replay_mismatches')}**", f"- Entry-ready cases: **{s.get('entry_ready_cases')}**", '- No-PnL/outcome-field exclusion: **PASS**' if run.get('conclusion')=='success' else '- No-PnL/outcome-field exclusion: **not confirmed**']
                          else:
                              lines += ['', '- Artifact exists, but summary.json is missing.']
                  else:
                      lines += ['', '- Semantic replay artifact is missing.']
              body='\n'.join(lines)
          comments=req(f'/repos/{repo}/issues/{pr}/comments?per_page=100')
          existing=next((c for c in comments if marker in str(c.get('body',''))),None)
          if existing: req(f"/repos/{repo}/issues/comments/{existing['id']}",'PATCH',{'body':body})
          else: req(f'/repos/{repo}/issues/{pr}/comments','POST',{'body':body})
          print(body)
          PY
