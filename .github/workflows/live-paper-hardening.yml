name: Live Paper Hardening

on:
  pull_request:
    paths:
      - 'strategy_lab/**'
      - 'scripts/**'
      - 'deployment/**'
      - 'docs/LIVE_PAPER_V2_RU.md'
      - 'docs/MULTI_PROJECT_CONTROL_PANEL_RU.md'
      - '.github/workflows/live-paper-hardening.yml'
  push:
    branches:
      - 'agent/live-paper-hardening'
    paths:
      - 'research_triggers/causal_full_revalidation.txt'
  workflow_dispatch:
    inputs:
      run_full_causal_revalidation:
        description: 'Run mandatory causal matrix, multi-WFO, deep validation and paper decision'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  repair-dual-screening-boolean:
    name: repair-dual-screening-boolean
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-paper-hardening
          fetch-depth: 0
      - name: Repair typo only when present
        run: |
          git pull --rebase origin agent/live-paper-hardening
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/run_twelve_month_dual_direction_screening.py')
          text = path.read_text(encoding='utf-8')
          old = '"promotion_allowed": false,'
          new = '"promotion_allowed": False,'
          if old not in text:
              print('Boolean is already correct')
              raise SystemExit(0)
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile scripts/run_twelve_month_dual_direction_screening.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run_twelve_month_dual_direction_screening.py
          if git diff --cached --quiet; then
            echo 'No repair needed'
            exit 0
          fi
          git commit -m 'Fix twelve-month screening result boolean'
          git push origin HEAD:agent/live-paper-hardening

  fast-checks:
    name: causal-and-vps-fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Compile Python
        run: python -m compileall -q strategy_lab scripts
      - name: Test causal history
        run: python -m strategy_lab.causal_history_smoke_test
      - name: Test optimized causal history equivalence
        run: python -m strategy_lab.causal_history_fast_smoke_test
      - name: Test completed higher-timeframe context
        run: python -m strategy_lab.closed_context_smoke_test
      - name: Test adaptive structure scope
        run: python -m strategy_lab.structure_scope_smoke_test
      - name: Test pullback resumption entry
        run: python -m strategy_lab.pullback_resumption_smoke_test
      - name: Test context alignment pipeline gate
        run: python -m strategy_lab.context_alignment_gate_smoke_test
      - name: Test matrix baseline filter roundtrip
        run: python -m strategy_lab.baseline_filter_roundtrip_smoke_test
      - name: Test Binance Vision archive planner and downloader
        run: python -m strategy_lab.binance_vision_download_smoke_test
      - name: Test Binance Vision archive merger
        run: python -m strategy_lab.binance_vision_archive_smoke_test
      - name: Test portfolio execution audit
        run: python -m strategy_lab.portfolio_audit_smoke_test
      - name: Test pooled research metrics
        run: python -m strategy_lab.research_metrics_smoke_test
      - name: Test all-candidate shadow learning
        run: python -m strategy_lab.shadow_history_smoke_test
      - name: Test layered decision engine
        run: python -m strategy_lab.decision_engine_smoke_test
      - name: Test closed-candle incremental storage
        run: python -m strategy_lab.live_market_smoke_test
      - name: Test strict walk-forward boundaries
        run: python -m strategy_lab.walk_forward_boundary_smoke_test
      - name: Test strict OOS rejection funnel
        run: python -m strategy_lab.walk_forward_funnel_smoke_test
      - name: Test simultaneous candidate priority
        run: python -m strategy_lab.portfolio_priority_smoke_test
      - name: Test existing integrated pipeline
        run: python -m strategy_lab.pipeline_smoke_test
      - name: Analyze committed pullback OOS funnel
        run: python scripts/analyze_long_history_pullback_funnel.py
      - name: Validate one-command installer syntax
        run: bash -n deployment/install_smoke.sh

  full-causal-revalidation:
    name: mandatory-causal-paper-validation
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_full_causal_revalidation == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run mandatory causal paper validation
        run: |
          python scripts/run_causal_paper_review_validation.py \
            --root results/causal_paper_review_validation \
            --layer-root results/causal_paper_review_universe
      - name: Upload causal validation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-causal-paper-review-validation
          path: |
            results/causal_paper_review_validation/**
            results/causal_paper_review_universe/**
