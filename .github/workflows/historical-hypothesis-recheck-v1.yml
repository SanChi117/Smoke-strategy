name: Historical Hypothesis Recheck V1

on:
  push:
    branches:
      - 'agent/live-paper-hardening'
    paths:
      - 'research_triggers/historical_hypothesis_recheck_v1.txt'

permissions:
  actions: read
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  historical-recheck:
    name: causal-historical-setup-family-recheck
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-paper-hardening
          fetch-depth: 0

      - name: Record running recheck id
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/live-paper-hardening
          mkdir -p results/historical_hypothesis_recheck_status_v1
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          Path('results/historical_hypothesis_recheck_status_v1/monitor.json').write_text(
              json.dumps({
                  'run_id': int(os.environ['GITHUB_RUN_ID']),
                  'source_head_sha': os.environ['GITHUB_SHA'],
                  'status': 'running',
                  'period': '2025-01-01 through 2026-06-30',
                  'mode': 'HISTORICAL_HYPOTHESIS_RECHECK_V1',
              }, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          git add results/historical_hypothesis_recheck_status_v1/monitor.json
          git commit -m 'Record running historical hypothesis recheck id' || true
          git push origin HEAD:agent/live-paper-hardening

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify causal and retrospective invariants
        run: |
          python -m py_compile scripts/run_historical_hypothesis_recheck_v1.py
          python -m strategy_lab.causal_history_fast_smoke_test
          python -m strategy_lab.closed_context_smoke_test
          python -m strategy_lab.walk_forward_boundary_smoke_test
          python -m strategy_lab.research_metrics_smoke_test
          python -m strategy_lab.portfolio_priority_smoke_test

      - name: Download fixed official Binance Futures history
        run: |
          python scripts/download_binance_vision_futures_archives.py \
            --symbols-file results/twelve_month_dual_screening_universe_v1/combined_symbols.txt \
            --interval 15m \
            --start-date '2025-01-01' \
            --end-date '2026-06-30' \
            --out-dir "$RUNNER_TEMP/binance-vision-historical-v1" \
            --summary-json results/historical_hypothesis_recheck_v1/archive_download_summary.json \
            --workers 8 \
            --retries 2 \
            --timeout 30

      - name: Merge and verify closed futures candles
        run: |
          python scripts/merge_binance_vision_futures_klines.py \
            --input-dir "$RUNNER_TEMP/binance-vision-historical-v1" \
            --out "$RUNNER_TEMP/smoke-historical-v1-15m.csv" \
            --symbols-file results/twelve_month_dual_screening_universe_v1/combined_symbols.txt \
            --interval 15m \
            --start-date '2025-01-01' \
            --end-date '2026-06-30' \
            --summary-json results/historical_hypothesis_recheck_v1/archive_merge_summary.json \
            --min-coverage 0.65

      - name: Run causal historical hypothesis recheck
        run: |
          python scripts/run_historical_hypothesis_recheck_v1.py \
            --candles "$RUNNER_TEMP/smoke-historical-v1-15m.csv" \
            --out-dir results/historical_hypothesis_recheck_v1 \
            --windows 10 \
            --lookback-days 30 \
            --profile research_500 \
            --pool-min-confidence 40

      - name: Upload historical recheck audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-historical-hypothesis-recheck-v1
          path: |
            results/historical_hypothesis_recheck_v1/result.json
            results/historical_hypothesis_recheck_v1/candidate_summary.csv
            results/historical_hypothesis_recheck_v1/candidate_folds/*.csv
            results/historical_hypothesis_recheck_v1/archive_download_summary.json
            results/historical_hypothesis_recheck_v1/archive_merge_summary.json
            research/historical_hypotheses_v1.json
            docs/SMOKE_FULL_RETROSPECTIVE_AUDIT_RU.md

      - name: Commit compact result and final status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/live-paper-hardening
          mkdir -p results/historical_hypothesis_recheck_status_v1
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          Path('results/historical_hypothesis_recheck_status_v1/monitor.json').write_text(
              json.dumps({
                  'run_id': int(os.environ['GITHUB_RUN_ID']),
                  'source_head_sha': os.environ['GITHUB_SHA'],
                  'status': '${{ job.status }}',
                  'period': '2025-01-01 through 2026-06-30',
                  'mode': 'HISTORICAL_HYPOTHESIS_RECHECK_V1',
              }, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          git add results/historical_hypothesis_recheck_status_v1/monitor.json
          for file in result.json candidate_summary.csv archive_download_summary.json archive_merge_summary.json; do
            test -f "results/historical_hypothesis_recheck_v1/$file" && git add "results/historical_hypothesis_recheck_v1/$file"
          done
          test -d results/historical_hypothesis_recheck_v1/candidate_folds && git add results/historical_hypothesis_recheck_v1/candidate_folds
          git commit -m 'Record causal historical hypothesis recheck result' || exit 0
          git push origin HEAD:agent/live-paper-hardening
