name: Smoke Test

on:
  workflow_dispatch:
    inputs:
      run_deep_research:
        description: 'Run full deep Binance research suite after smoke checks'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      run_sector_cycle:
        description: 'Run sector rotation research cycle after smoke checks'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      sector_limit:
        description: 'Candles per symbol for sector cycle'
        required: false
        default: '1500'
        type: choice
        options:
          - '1500'
          - '2000'
          - '3000'
      sector_windows:
        description: 'Walk-forward windows for sector cycle'
        required: false
        default: '4'
        type: choice
        options:
          - '4'
          - '6'
  push:
    paths:
      - 'strategy_lab/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'docs/**'
      - '.env.example'
      - '.github/workflows/smoke.yml'
      - 'requirements.txt'
      - 'pyproject.toml'

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: '1'

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run rolling smoke test
        run: |
          python -m strategy_lab.smoke_test

      - name: Run integrated pipeline smoke test
        run: |
          python -m strategy_lab.pipeline_smoke_test

      - name: Run candle pipeline smoke test
        run: |
          python -m strategy_lab.candle_pipeline_smoke_test

      - name: Run data quality CLI smoke test
        run: |
          python -m strategy_lab.data_quality_cli_smoke_test

      - name: Run Binance market data smoke test
        run: |
          python -m strategy_lab.binance_market_data_smoke_test

      - name: Run Binance real-data quick research check
        run: |
          python scripts/load_binance_candles.py \
            --symbols BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT \
            --interval 1h \
            --limit 300 \
            --out data/binance_real_ci_candles.csv
          python scripts/run_end_to_end_pipeline.py \
            --candles data/binance_real_ci_candles.csv \
            --out-dir results/binance_real_ci \
            --profile growth_100_20x \
            --min-confidence 40
          echo '--- end_to_end_summary.csv ---'
          cat results/binance_real_ci/end_to_end_summary.csv
          echo '--- report_sanity_summary.csv ---'
          cat results/binance_real_ci/report_sanity_summary.csv
          echo '--- candle_research_report.csv ---'
          cat results/binance_real_ci/candle_research_report.csv

      - name: Run Binance real-data matrix quick check
        run: |
          python scripts/run_binance_real_matrix.py \
            --symbols BTCUSDT,ETHUSDT,SOLUSDT \
            --interval 1h \
            --limit 800 \
            --out-dir results/binance_real_matrix_ci
          echo '--- matrix_summary.md ---'
          cat results/binance_real_matrix_ci/matrix_summary.md
          echo '--- matrix_summary.csv ---'
          cat results/binance_real_matrix_ci/matrix_summary.csv
          echo '--- baseline_candidate.md ---'
          cat results/binance_real_matrix_ci/baseline_candidate/baseline_candidate.md

      - name: Run Binance walk-forward quick check
        run: |
          python scripts/run_binance_walk_forward.py \
            --symbols BTCUSDT,ETHUSDT,SOLUSDT \
            --interval 1h \
            --limit 1000 \
            --windows 2 \
            --lookback-days 30 \
            --baseline results/binance_real_matrix_ci/baseline_candidate/baseline_candidate.json \
            --out-dir results/binance_walk_forward_ci
          echo '--- walk_forward_summary.md ---'
          cat results/binance_walk_forward_ci/walk_forward_summary.md
          echo '--- walk_forward_summary.csv ---'
          cat results/binance_walk_forward_ci/walk_forward_summary.csv

      - name: Make research decision
        run: |
          python scripts/make_research_decision.py \
            --matrix results/binance_real_matrix_ci/matrix_summary.csv \
            --baseline results/binance_real_matrix_ci/baseline_candidate/baseline_candidate.json \
            --walk-forward results/binance_walk_forward_ci/walk_forward_summary.csv \
            --out-dir results/research_decision_ci
          echo '--- research_decision.md ---'
          cat results/research_decision_ci/research_decision.md
          echo '--- research_decision.json ---'
          cat results/research_decision_ci/research_decision.json

      - name: Run full deep Binance research suite
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_deep_research == 'true' }}
        run: |
          python scripts/run_deep_research_suite.py \
            --root results/deep_research_manual \
            --interval 1h \
            --limit 1500 \
            --windows 4 \
            --lookback-days 30
          echo '--- deep research decision ---'
          cat results/deep_research_manual/decision/research_decision.md

      - name: Run sector rotation research cycle
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_sector_cycle == 'true' }}
        run: |
          python scripts/run_sector_research_cycle.py \
            --top-n 10 \
            --limit ${{ github.event.inputs.sector_limit }} \
            --windows ${{ github.event.inputs.sector_windows }} \
            --allow-fail
          python scripts/classify_sector_cycle.py \
            --input results/sector_research_cycle/sector_cycle_summary.csv \
            --out-dir results/sector_research_cycle
          echo '--- sector_cycle_summary.md ---'
          cat results/sector_research_cycle/sector_cycle_summary.md
          echo '--- sector_classification.md ---'
          cat results/sector_research_cycle/sector_classification.md
          echo '--- sector_rotation_baseline_candidate.json ---'
          cat results/sector_research_cycle/sector_rotation_baseline_candidate.json

      - name: Upload Binance research artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-binance-research-results
          path: |
            data/binance_real_ci_candles.csv
            results/binance_real_ci/**
            results/binance_real_matrix_ci/**
            results/binance_walk_forward_ci/**
            results/research_decision_ci/**
            results/deep_research_manual/**
            results/sector_research_cycle/**

      - name: Run report sanity CLI smoke test
        run: |
          python -m strategy_lab.report_sanity_cli_smoke_test

      - name: Run universe input smoke test
        run: |
          python -m strategy_lab.universe_input_smoke_test

      - name: Run paper mode smoke test
        run: |
          python -m strategy_lab.paper_mode_smoke_test

      - name: Run regime samples smoke test
        run: |
          python -m strategy_lab.regime_samples_smoke_test

      - name: Run local demo smoke test
        run: |
          python -m strategy_lab.local_demo_smoke_test
