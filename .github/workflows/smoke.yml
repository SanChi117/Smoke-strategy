name: Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'strategy_lab/**'
      - 'scripts/**'
      - '.github/workflows/smoke.yml'
      - 'requirements.txt'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: '1'

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run smoke test
        run: |
          python -m strategy_lab.smoke_test
