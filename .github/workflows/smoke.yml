name: Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'strategy_lab/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'docs/**'
      - '.env.example'
      - '.github/workflows/smoke.yml'
      - 'requirements.txt'
      - 'pyproject.toml'

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: '1'

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run rolling smoke test
        run: |
          python -m strategy_lab.smoke_test

      - name: Run integrated pipeline smoke test
        run: |
          python -m strategy_lab.pipeline_smoke_test

      - name: Run candle pipeline smoke test
        run: |
          python -m strategy_lab.candle_pipeline_smoke_test

      - name: Run data quality CLI smoke test
        run: |
          python -m strategy_lab.data_quality_cli_smoke_test

      - name: Run Binance market data smoke test
        run: |
          python -m strategy_lab.binance_market_data_smoke_test

      - name: Run Binance real-data quick research check
        run: |
          python scripts/load_binance_candles.py \
            --symbols BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT \
            --interval 1h \
            --limit 300 \
            --out data/binance_real_ci_candles.csv
          python scripts/run_end_to_end_pipeline.py \
            --candles data/binance_real_ci_candles.csv \
            --out-dir results/binance_real_ci \
            --profile growth_100_20x \
            --min-confidence 40
          echo '--- end_to_end_summary.csv ---'
          cat results/binance_real_ci/end_to_end_summary.csv
          echo '--- report_sanity_summary.csv ---'
          cat results/binance_real_ci/report_sanity_summary.csv
          echo '--- candle_research_report.csv ---'
          cat results/binance_real_ci/candle_research_report.csv

      - name: Run Binance real-data matrix quick check
        run: |
          python scripts/run_binance_real_matrix.py \
            --symbols BTCUSDT,ETHUSDT,SOLUSDT \
            --interval 1h \
            --limit 800 \
            --out-dir results/binance_real_matrix_ci
          echo '--- matrix_summary.md ---'
          cat results/binance_real_matrix_ci/matrix_summary.md
          echo '--- matrix_summary.csv ---'
          cat results/binance_real_matrix_ci/matrix_summary.csv

      - name: Run report sanity CLI smoke test
        run: |
          python -m strategy_lab.report_sanity_cli_smoke_test

      - name: Run universe input smoke test
        run: |
          python -m strategy_lab.universe_input_smoke_test

      - name: Run paper mode smoke test
        run: |
          python -m strategy_lab.paper_mode_smoke_test

      - name: Run regime samples smoke test
        run: |
          python -m strategy_lab.regime_samples_smoke_test

      - name: Run local demo smoke test
        run: |
          python -m strategy_lab.local_demo_smoke_test
