name: SMOKE MTF FTA-First V3 Recognition

on:
  push:
    branches: ['agent/smoke-mtf-fta-first-v3']
    paths:
      - 'strategy_lab/mtf_fta_first_entry_v3.py'
      - 'strategy_lab/mtf_fta_first_entry_v3_smoke_test.py'
      - 'strategy_lab/mtf_fta_first_no_pnl_v3.py'
      - 'strategy_lab/mtf_fta_first_no_pnl_v3_smoke_test.py'
      - 'strategy_lab/mtf_fta_first_aggregation_v3_smoke_test.py'
      - 'scripts/run_smoke_mtf_fta_first_v3_recognition.py'
      - 'scripts/aggregate_smoke_mtf_fta_first_v3_recognition.py'
      - 'research/smoke_mtf_fta_first_v3_prereg_v1.json'
      - 'research/SMOKE_MTF_FTA_FIRST_V3_DESIGN_V1.md'
      - '.github/workflows/smoke-mtf-fta-first-v3.yml'
      - 'research_triggers/smoke_mtf_fta_first_v3_ci.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recognition-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Compile V3 recognition modules
        run: |
          python -m py_compile strategy_lab/mtf_fta_first_entry_v3.py
          python -m py_compile strategy_lab/mtf_fta_first_no_pnl_v3.py
          python -m py_compile scripts/run_smoke_mtf_fta_first_v3_recognition.py
          python -m py_compile scripts/aggregate_smoke_mtf_fta_first_v3_recognition.py
      - name: Run FTA-first V3 regression tests
        run: |
          python -m strategy_lab.mtf_fta_first_entry_v3_smoke_test
          python -m strategy_lab.mtf_fta_first_no_pnl_v3_smoke_test
          python -m strategy_lab.mtf_fta_first_aggregation_v3_smoke_test
      - name: Verify reused causal V2 primitives
        run: |
          python -m strategy_lab.mtf_entry_model_v2_smoke_test
          python -m strategy_lab.mtf_semantic_corrections_v2_smoke_test
      - name: Validate preregistration remains frozen and outcome-blind
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('research/smoke_mtf_fta_first_v3_prereg_v1.json').read_text(encoding='utf-8'))
          assert payload['study_id'] == 'SMOKE_MTF_FTA_FIRST_V3_RECOGNITION_V1'
          assert payload['candidate']['max_candidates'] == 1
          assert payload['candidate']['symbols'] == ['BTCUSDT','ETHUSDT','SOLUSDT','LINKUSDT','AAVEUSDT']
          assert payload['candidate']['directions'] == ['long','short']
          assert payload['data']['recognition_start'] == '2025-01-01'
          assert payload['data']['recognition_end_exclusive'] == '2026-07-01'
          assert payload['bos']['minimum_body_atr'] == 0.50
          assert payload['bos']['minimum_close_location'] == 0.70
          assert payload['pullback']['maximum_bars_after_bos'] == 8
          assert payload['gates']['minimum_structural_rr'] == 1.70
          assert payload['gates']['minimum_quality_score'] == 55.0
          assert payload['gates']['minimum_independent_entry_ready_cases_before_profitability'] == 60
          raw = json.dumps(payload).lower()
          assert 'observed_pnl' not in raw
          assert 'future_return_value' not in raw
          assert 'profit_factor_value' not in raw
          print('FTA-first V3 preregistration guard: PASS')
          PY
