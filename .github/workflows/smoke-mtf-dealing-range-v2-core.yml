name: SMOKE MTF Dealing Range V2 Core

on:
  push:
    branches:
      - 'agent/smoke-mtf-dealing-range-v2'
    paths:
      - 'strategy_lab/mtf_dealing_range_v2.py'
      - 'strategy_lab/event_risk.py'
      - 'strategy_lab/mtf_dealing_range_v2_smoke_test.py'
      - 'research/smoke_mtf_dealing_range_v2_core.json'
      - 'research_triggers/smoke_mtf_dealing_range_v2_core.txt'
      - '.github/workflows/smoke-mtf-dealing-range-v2-core.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  causal-recognition-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout V2 research branch
        uses: actions/checkout@v4
        with:
          ref: agent/smoke-mtf-dealing-range-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Compile new core
        run: |
          python -m py_compile strategy_lab/mtf_dealing_range_v2.py
          python -m py_compile strategy_lab/event_risk.py
          python -m py_compile strategy_lab/mtf_dealing_range_v2_smoke_test.py

      - name: Verify existing causal invariants
        run: |
          python -m strategy_lab.closed_context_smoke_test
          python -m strategy_lab.walk_forward_boundary_smoke_test
          python -m strategy_lab.research_metrics_smoke_test

      - name: Verify MTF range, pivot and event causality
        run: python -m strategy_lab.mtf_dealing_range_v2_smoke_test
