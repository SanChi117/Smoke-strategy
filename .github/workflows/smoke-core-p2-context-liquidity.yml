name: SMOKE CORE P2 Context Liquidity

on:
  push:
    branches:
      - agent/smoke-core-1-p2-context-liquidity
    paths:
      - 'strategy_lab/context_liquidity_engine_v1.py'
      - 'strategy_lab/context_liquidity_engine_v1_smoke_test.py'
      - 'strategy_lab/poi_imbalance_engine_v1.py'
      - 'strategy_lab/poi_imbalance_engine_v1_smoke_test.py'
      - 'strategy_lab/mtf_dealing_range_v2.py'
      - 'strategy_lab/period_liquidity_levels.py'
      - 'research/SMOKE_CORE_P2_CONTEXT_LIQUIDITY_CONTRACT_V1.md'
      - '.github/workflows/smoke-core-p2-context-liquidity.yml'
  pull_request:
    branches:
      - agent/smoke-core-1-p1-poi-imbalance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Compile P1 and P2
        run: |
          python -m py_compile strategy_lab/context_liquidity_engine_v1.py
          python -m py_compile strategy_lab/context_liquidity_engine_v1_smoke_test.py
          python -m py_compile strategy_lab/poi_imbalance_engine_v1.py
      - name: P2 semantic tests
        id: p2_tests
        shell: bash
        run: |
          set +e
          python -m unittest strategy_lab.context_liquidity_engine_v1_smoke_test -v > p2-semantic-test-output.txt 2>&1
          status=$?
          cat p2-semantic-test-output.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload P2 semantic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-semantic-test-diagnostics
          path: p2-semantic-test-output.txt
          if-no-files-found: error
      - name: Enforce P2 semantic result
        if: steps.p2_tests.outputs.exit_code != '0'
        run: exit 1
      - name: P1 regression tests
        run: python -m unittest strategy_lab.poi_imbalance_engine_v1_smoke_test -v
      - name: Reused causal primitive tests
        run: |
          python -m unittest strategy_lab.mtf_dealing_range_v2_smoke_test -v
          python -m unittest strategy_lab.period_liquidity_levels_smoke_test -v
      - name: Frozen contract and no-outcome guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from dataclasses import asdict
          from strategy_lab.context_liquidity_engine_v1 import ContextLiquidityConfig, FORBIDDEN_KEY_FRAGMENTS

          cfg = asdict(ContextLiquidityConfig())
          expected = {
              'atr_length': 14,
              'volatility_lookback': 20,
              'expansion_ratio': 1.35,
              'compression_ratio': 0.75,
              'direction_threshold': 0.15,
              'equal_tolerance_atr': 0.12,
              'equal_tolerance_pct': 0.0012,
              'equal_min_separation_bars': 2,
              'sweep_buffer_atr': 0.03,
              'invalidation_buffer_atr': 0.05,
              'invalidation_closes': 2,
          }
          for key, value in expected.items():
              assert cfg[key] == value, (key, cfg[key], value)
          assert tuple(cfg['context_weights']) == (('1M', 0.10), ('1w', 0.20), ('1d', 0.35), ('4h', 0.35))
          source = open('strategy_lab/context_liquidity_engine_v1.py', encoding='utf-8').read().lower()
          for fragment in FORBIDDEN_KEY_FRAGMENTS:
              assert f'"{fragment}"' not in source and f"'{fragment}'" not in source, fragment
          print('P2 frozen contract guard: PASS')
          PY