name: Bootstrap EMBER Project

on:
  push:
    branches:
      - agent/ember-research-engine-v0.2.0
    paths:
      - ".ember-bootstrap/**"
      - ".github/workflows/ember-bootstrap.yml"

permissions:
  contents: write

jobs:
  unpack-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Unpack project archive
        run: |
          cat .ember-bootstrap/part-* > /tmp/ember-project.b64
          base64 --decode /tmp/ember-project.b64 > /tmp/ember-project.tar.gz
          tar -xzf /tmp/ember-project.tar.gz
          rm -rf .ember-bootstrap .github/workflows/ember-bootstrap.yml
      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement EMBER Research Engine 0.2.0 from specification"
          git push origin HEAD:${{ github.ref_name }}
