name: SMOKE CORE P7 Full Recognition

on:
  push:
    branches:
      - agent/smoke-core-1-p7-outcome-blind-recognition
    paths:
      - 'research/SMOKE_CORE_P7_FULL_RECOGNITION_PREREG_V1.md'
      - 'strategy_lab/p7_binance_vision_acquisition_v1.py'
      - 'strategy_lab/p7_full_recognition_runner_v1.py'
      - 'strategy_lab/p7_full_recognition_entrypoint_v1.py'
      - 'strategy_lab/p7_full_recognition_runner_v1_smoke_test.py'
      - 'strategy_lab/p7_partitioned_recognition_v1.py'
      - 'strategy_lab/p7_partitioned_recognition_v1_smoke_test.py'
      - 'strategy_lab/p7_symbol_partitioned_recognition_v1.py'
      - 'strategy_lab/p7_symbol_partitioned_recognition_v1_smoke_test.py'
      - '.github/workflows/smoke-core-p7-full-recognition.yml'
  pull_request:
    branches:
      - agent/smoke-core-1-p6-scenario-fusion
    paths:
      - 'research/SMOKE_CORE_P7_FULL_RECOGNITION_PREREG_V1.md'
      - 'strategy_lab/p7_binance_vision_acquisition_v1.py'
      - 'strategy_lab/p7_full_recognition_runner_v1.py'
      - 'strategy_lab/p7_full_recognition_entrypoint_v1.py'
      - 'strategy_lab/p7_full_recognition_runner_v1_smoke_test.py'
      - 'strategy_lab/p7_partitioned_recognition_v1.py'
      - 'strategy_lab/p7_partitioned_recognition_v1_smoke_test.py'
      - 'strategy_lab/p7_symbol_partitioned_recognition_v1.py'
      - 'strategy_lab/p7_symbol_partitioned_recognition_v1_smoke_test.py'
      - '.github/workflows/smoke-core-p7-full-recognition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-fixed-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Validate exact preregistration
        shell: bash
        run: |
          set -euo pipefail
          test -s research/SMOKE_CORE_P7_FULL_RECOGNITION_PREREG_V1.md
          grep -q 'SMOKE_CORE_P7_FULL_RECOGNITION_FIXED_V1' research/SMOKE_CORE_P7_FULL_RECOGNITION_PREREG_V1.md
          grep -q '2024-01-01T00:00:00+00:00' research/SMOKE_CORE_P7_FULL_RECOGNITION_PREREG_V1.md
          grep -q '2024-06-30T23:55:00+00:00' research/SMOKE_CORE_P7_FULL_RECOGNITION_PREREG_V1.md
          grep -q 'Exactly 30 archives' research/SMOKE_CORE_P7_FULL_RECOGNITION_PREREG_V1.md
          grep -q 'exactly 10 contiguous chronological folds' research/SMOKE_CORE_P7_FULL_RECOGNITION_PREREG_V1.md
          grep -q 'at least 60 independent' research/SMOKE_CORE_P7_FULL_RECOGNITION_PREREG_V1.md
      - name: Compile acquisition and exact runners
        run: |
          python -m py_compile \
            strategy_lab/p7_binance_vision_acquisition_v1.py \
            strategy_lab/p7_full_recognition_runner_v1.py \
            strategy_lab/p7_full_recognition_entrypoint_v1.py \
            strategy_lab/p7_full_recognition_runner_v1_smoke_test.py \
            strategy_lab/p7_partitioned_recognition_v1.py \
            strategy_lab/p7_partitioned_recognition_v1_smoke_test.py \
            strategy_lab/p7_symbol_partitioned_recognition_v1.py \
            strategy_lab/p7_symbol_partitioned_recognition_v1_smoke_test.py
      - name: Focused full-recognition semantic tests
        run: |
          python -u strategy_lab/p7_full_recognition_runner_v1_smoke_test.py
          python -u strategy_lab/p7_partitioned_recognition_v1_smoke_test.py
          python -u strategy_lab/p7_symbol_partitioned_recognition_v1_smoke_test.py
      - name: Acquire exact Binance Vision archives
        run: python -u strategy_lab/p7_binance_vision_acquisition_v1.py
      - name: Verify acquisition manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research_outputs/p7_full_recognition_data_v1')
          manifest = json.loads((root / 'p7_full_recognition_data_manifest_v1.json').read_text())
          assert manifest['recognition_id'] == 'SMOKE_CORE_P7_FULL_RECOGNITION_FIXED_V1'
          assert manifest['archive_count'] == 30
          assert manifest['symbols'] == ['BTCUSDT','ETHUSDT','SOLUSDT','LINKUSDT','AAVEUSDT']
          assert manifest['months'] == ['2024-01','2024-02','2024-03','2024-04','2024-05','2024-06']
          assert len(manifest['archives']) == 30
          assert set(manifest['canonical_files']) == set(manifest['symbols'])
          for symbol, row in manifest['canonical_files'].items():
              assert row['row_count'] > 50000, (symbol, row)
              assert len(row['sha256']) == 64
              assert (root / row['filename']).is_file()
              assert row['first_open_time'].startswith('2024-01-01T00:00:00')
              assert row['last_open_time'].startswith('2024-06-30T23:55:00')
          forbidden = ('pnl','profit_factor','future_return','trade_outcome','mfe','mae','drawdown','equity','target_hit','stop_hit')
          raw = json.dumps(manifest, sort_keys=True).lower()
          assert not any(f'"{key}"' in raw for key in forbidden)
          PY
      - name: Upload locked P7 dataset
        uses: actions/upload-artifact@v4
        with:
          name: p7-full-recognition-data-v1
          path: research_outputs/p7_full_recognition_data_v1/
          if-no-files-found: error
          retention-days: 90

  scan-symbol:
    needs: acquire-fixed-data
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, LINKUSDT, AAVEUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Download locked P7 dataset
        uses: actions/download-artifact@v4
        with:
          name: p7-full-recognition-data-v1
          path: research_outputs/p7_full_recognition_data_v1
      - name: Execute exact complete-symbol scan with internal ten-fold accounting
        run: |
          python -u strategy_lab/p7_symbol_partitioned_recognition_v1.py scan \
            --symbol '${{ matrix.symbol }}' \
            --output 'research_outputs/p7_symbol_partitions/p7_symbol_${{ matrix.symbol }}.json'
      - name: Upload outcome-blind symbol partition
        uses: actions/upload-artifact@v4
        with:
          name: p7-full-recognition-symbol-${{ matrix.symbol }}
          path: research_outputs/p7_symbol_partitions/p7_symbol_${{ matrix.symbol }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate-recognition:
    needs: scan-symbol
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Download all complete-symbol partitions
        uses: actions/download-artifact@v4
        with:
          pattern: p7-full-recognition-symbol-*
          path: research_outputs/p7_symbol_partitions
      - name: Aggregate once with global fingerprint de-duplication
        run: |
          python -u strategy_lab/p7_symbol_partitioned_recognition_v1.py aggregate \
            --input-dir research_outputs/p7_symbol_partitions \
            --output research_outputs/p7_full_recognition_report_v1.json
      - name: Verify exact no-outcome recognition report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('research_outputs/p7_full_recognition_report_v1.json')
          report = json.loads(path.read_text())
          assert report['recognition_id'] == 'SMOKE_CORE_P7_FULL_RECOGNITION_FIXED_V1'
          assert report['fold_count'] == 10
          assert report['execution_topology'] == 'FIVE_SYMBOL_PARTITIONS_WITH_INTERNAL_TEN_FOLD_ACCOUNTING_THEN_GLOBAL_DEDUPE_V1'
          assert set(report['recognition']['by_symbol']) == {'BTCUSDT','ETHUSDT','SOLUSDT','LINKUSDT','AAVEUSDT'}
          assert set(report['recognition']['by_direction']) == {'LONG','SHORT'}
          assert set(map(int, report['recognition']['by_fold'])) == set(range(10))
          forbidden = ('pnl','profit_factor','future_return','trade_outcome','mfe','mae','drawdown','equity','target_hit','stop_hit')
          raw = json.dumps(report, sort_keys=True).lower()
          assert not any(f'"{key}"' in raw for key in forbidden)
          PY
      - name: Upload recognition report
        uses: actions/upload-artifact@v4
        with:
          name: p7-full-recognition-report-v1
          path: research_outputs/p7_full_recognition_report_v1.json
          if-no-files-found: error
          retention-days: 90

# Technical execution topology only. Each symbol is scanned once, while the
# frozen 10 chronological folds remain embedded in observations and final
# accounting. Period, source, symbols, directions, semantics, weights,
# thresholds, lifecycle, fingerprint, rearm and no-outcome scope are unchanged.
