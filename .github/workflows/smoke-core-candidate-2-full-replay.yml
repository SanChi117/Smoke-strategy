name: SMOKE CORE Candidate 2 Full Causal Replay

on:
  pull_request:
    branches:
      - agent/smoke-core-1-p8-semantic-freeze
    paths:
      - 'strategy_lab/candidate_2_*.py'
      - '.github/workflows/smoke-core-candidate-2-full-replay.yml'
      - '.github/workflows/smoke-core-candidate-2-checkpoint-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: smoke-core-candidate-2-full-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: |
          python -m py_compile strategy_lab/candidate_2_*.py
          python -u strategy_lab/candidate_2_hypothesis_contract_v1_smoke_test.py
          python -u strategy_lab/candidate_2_causal_engines_v1_smoke_test.py
          python -u strategy_lab/candidate_2_policy_quality_v1_smoke_test.py
          python -u strategy_lab/candidate_2_recognition_v1_smoke_test.py

  segment-0:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, LINKUSDT, AAVEUSDT]
    uses: ./.github/workflows/smoke-core-candidate-2-checkpoint-worker.yml
    with:
      symbol: ${{ matrix.symbol }}
      segment: 0
      has_checkpoint: false
    secrets: inherit

  segment-1:
    needs: segment-0
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, LINKUSDT, AAVEUSDT]
    uses: ./.github/workflows/smoke-core-candidate-2-checkpoint-worker.yml
    with:
      symbol: ${{ matrix.symbol }}
      segment: 1
      previous_segment: 0
      has_checkpoint: true
    secrets: inherit

  equivalence:
    needs: segment-1
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download frozen replay/debug dataset
        uses: actions/download-artifact@v4
        with:
          name: candidate-1-development-locked-data-v2
          path: research_outputs/p7_full_recognition_data_v1
          repository: SanChi117/Smoke-strategy
          run-id: '31130707800'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download authoritative BTC levels
        uses: actions/download-artifact@v4
        with:
          name: p7-full-recognition-levels-BTCUSDT
          path: research_outputs/p7_levels
          repository: SanChi117/Smoke-strategy
          run-id: '30899050584'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download checkpointed BTC segment 1
        uses: actions/download-artifact@v4
        with:
          name: candidate-2-causal-replay-BTCUSDT-1
          path: research_outputs/equivalence/checkpointed
      - name: Require zero semantic mismatch vs legacy replay
        env:
          P7_LEVELS_FILE: research_outputs/p7_levels/p7_levels_BTCUSDT.pkl
          P7_LEVELS_SYMBOL: BTCUSDT
        run: |
          mkdir -p research_outputs/equivalence/legacy
          python -u strategy_lab/candidate_2_replay_shards_v1.py scan-segment \
            --symbol BTCUSDT --segment-index 1 --segment-count 16 \
            --data-root research_outputs/p7_full_recognition_data_v1 \
            --output research_outputs/equivalence/legacy/candidate_2_replay_BTCUSDT_1.json
          python -u strategy_lab/candidate_2_replay_shards_v1.py verify-equivalence \
            --legacy research_outputs/equivalence/legacy/candidate_2_replay_BTCUSDT_1.json \
            --checkpointed research_outputs/equivalence/checkpointed/candidate_2_replay_BTCUSDT_1.json

  segment-2:
    needs: equivalence
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, LINKUSDT, AAVEUSDT]
    uses: ./.github/workflows/smoke-core-candidate-2-checkpoint-worker.yml
    with:
      symbol: ${{ matrix.symbol }}
      segment: 2
      previous_segment: 1
      has_checkpoint: true
    secrets: inherit

  segment-3:
    needs: segment-2
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, LINKUSDT, AAVEUSDT]
    uses: ./.github/workflows/smoke-core-candidate-2-checkpoint-worker.yml
    with:
      symbol: ${{ matrix.symbol }}
      segment: 3
      previous_segment: 2
      has_checkpoint: true
    secrets: inherit

  segment-4:
    needs: segment-3
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, LINKUSDT, AAVEUSDT]
    uses: ./.github/workflows/smoke-core-candidate-2-checkpoint-worker.yml
    with:
      symbol: ${{ matrix.symbol }}
      segment: 4
      previous_segment: 3
      has_checkpoint: true
    secrets: inherit

  segment-5:
    needs: segment-4
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, LINKUSDT, AAVEUSDT]
    uses: ./.github/workflows/smoke-core-candidate-2-checkpoint-worker.yml
    with:
      symbol: ${{ matrix.symbol }}
      segment: 5
      previous_segment: 4
      has_checkpoint: true
    secrets: inherit

  segment-6:
    needs: segment-5
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, LINKUSDT, AAVEUSDT]
    uses: ./.github/workflows/smoke-core-candidate-2-checkpoint-worker.yml
    with:
      symbol: ${{ matrix.symbol }}
      segment: 6
      previous_segment: 5
      has_checkpoint: true
    secrets: inherit

  segment-7:
    needs: segment-6
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, LINKUSDT, AAVEUSDT]
    uses: ./.github/workflows/smoke-core-candidate-2-checkpoint-worker.yml
    with:
      symbol: ${{ matrix.symbol }}
      segment: 7
      previous_segment: 6
      has_checkpoint: true
    secrets: inherit

  segment-8:
    needs: segment-7
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, LINKUSDT, AAVEUSDT]
    uses: ./.github/workflows/smoke-core-candidate-2-checkpoint-worker.yml
    with:
      symbol: ${{ matrix.symbol }}
      segment: 8
      previous_segment: 7
      has_checkpoint: true
    secrets: inherit

  segment-9:
    needs: segment-8
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, LINKUSDT, AAVEUSDT]
    uses: ./.github/workflows/smoke-core-candidate-2-checkpoint-worker.yml
    with:
      symbol: ${{ matrix.symbol }}
      segment: 9
      previous_segment: 8
      has_checkpoint: true
    secrets: inherit

  segment-10:
    needs: segment-9
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, LINKUSDT, AAVEUSDT]
    uses: ./.github/workflows/smoke-core-candidate-2-checkpoint-worker.yml
    with:
      symbol: ${{ matrix.symbol }}
      segment: 10
      previous_segment: 9
      has_checkpoint: true
    secrets: inherit

  segment-11:
    needs: segment-10
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, LINKUSDT, AAVEUSDT]
    uses: ./.github/workflows/smoke-core-candidate-2-checkpoint-worker.yml
    with:
      symbol: ${{ matrix.symbol }}
      segment: 11
      previous_segment: 10
      has_checkpoint: true
    secrets: inherit

  segment-12:
    needs: segment-11
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, LINKUSDT, AAVEUSDT]
    uses: ./.github/workflows/smoke-core-candidate-2-checkpoint-worker.yml
    with:
      symbol: ${{ matrix.symbol }}
      segment: 12
      previous_segment: 11
      has_checkpoint: true
    secrets: inherit

  segment-13:
    needs: segment-12
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, LINKUSDT, AAVEUSDT]
    uses: ./.github/workflows/smoke-core-candidate-2-checkpoint-worker.yml
    with:
      symbol: ${{ matrix.symbol }}
      segment: 13
      previous_segment: 12
      has_checkpoint: true
    secrets: inherit

  segment-14:
    needs: segment-13
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, LINKUSDT, AAVEUSDT]
    uses: ./.github/workflows/smoke-core-candidate-2-checkpoint-worker.yml
    with:
      symbol: ${{ matrix.symbol }}
      segment: 14
      previous_segment: 13
      has_checkpoint: true
    secrets: inherit

  segment-15:
    needs: segment-14
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, LINKUSDT, AAVEUSDT]
    uses: ./.github/workflows/smoke-core-candidate-2-checkpoint-worker.yml
    with:
      symbol: ${{ matrix.symbol }}
      segment: 15
      previous_segment: 14
      has_checkpoint: true
    secrets: inherit

  aggregate-causal-replay:
    needs: segment-15
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-2-causal-replay-*
          path: research_outputs/candidate_2_replay_shards
          merge-multiple: true
      - name: Aggregate and audit Candidate 2 replay
        run: |
          python -u strategy_lab/candidate_2_dynamic_checkpoint_aggregate_v1.py \
            --input-dir research_outputs/candidate_2_replay_shards \
            --output research_outputs/candidate_2_full_causal_replay_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research_outputs/candidate_2_full_causal_replay_v1.json').read_text())
          assert r['purpose']=='CAUSAL_REPLAY_DEBUG_ONLY_NOT_PROFITABILITY'
          assert r['physical_shard_count']==80
          assert r['segments_per_symbol']==16
          assert r['semantic_clean'] is True
          assert r['transport']=='AUTHORITATIVE_P7_INCREMENTAL_POI_CHECKPOINT_CHAIN_PLUS_PRECOMPUTED_LEVELS'
          q=r['recognition']
          assert q['duplicate_rows']==0 and q['forbidden_rows']==0
          assert q['missing_provenance_rows']==0 and q['invalid_lifecycle_rows']==0
          assert q['reproducible'] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-core-candidate-2-full-causal-replay-v1
          path: research_outputs/candidate_2_full_causal_replay_v1.json
          if-no-files-found: error
          retention-days: 90
