name: SMOKE CORE P8 Semantic Replay Freeze

on:
  pull_request:
    branches:
      - agent/smoke-core-1-p7-outcome-blind-recognition
    paths:
      - 'research/SMOKE_CORE_P8_SEMANTIC_REPLAY_FREEZE_PREREG_V1.md'
      - 'strategy_lab/p8_semantic_replay_freeze_v1.py'
      - 'strategy_lab/p8_semantic_replay_freeze_v1_smoke_test.py'
      - '.github/workflows/smoke-core-p8-semantic-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-fixed-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Validate frozen P8 preregistration
        shell: bash
        run: |
          set -euo pipefail
          test -s research/SMOKE_CORE_P8_SEMANTIC_REPLAY_FREEZE_PREREG_V1.md
          grep -q 'SMOKE_CORE_1_0_CANDIDATE_1' research/SMOKE_CORE_P8_SEMANTIC_REPLAY_FREEZE_PREREG_V1.md
          grep -q 'mismatch_count = 0' research/SMOKE_CORE_P8_SEMANTIC_REPLAY_FREEZE_PREREG_V1.md
          grep -q 'b749be2578251a3b447a78a79009ff3d45cffc57' research/SMOKE_CORE_P8_SEMANTIC_REPLAY_FREEZE_PREREG_V1.md
          grep -q '2620' research/SMOKE_CORE_P8_SEMANTIC_REPLAY_FREEZE_PREREG_V1.md
      - name: Compile P8 replay and frozen P7 acquisition
        run: |
          python -m py_compile \
            strategy_lab/p7_binance_vision_acquisition_v1.py \
            strategy_lab/p7_full_recognition_runner_v1.py \
            strategy_lab/p8_semantic_replay_freeze_v1.py \
            strategy_lab/p8_semantic_replay_freeze_v1_smoke_test.py
      - name: P8 focused semantic tests
        run: python -u strategy_lab/p8_semantic_replay_freeze_v1_smoke_test.py
      - name: Acquire exact locked Binance Vision dataset
        run: python -u strategy_lab/p7_binance_vision_acquisition_v1.py
      - name: Verify fixed acquisition contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research_outputs/p7_full_recognition_data_v1')
          manifest = json.loads((root / 'p7_full_recognition_data_manifest_v1.json').read_text())
          assert manifest['recognition_id'] == 'SMOKE_CORE_P7_FULL_RECOGNITION_FIXED_V1'
          assert manifest['archive_count'] == 30
          assert manifest['symbols'] == ['BTCUSDT','ETHUSDT','SOLUSDT','LINKUSDT','AAVEUSDT']
          assert manifest['months'] == ['2024-01','2024-02','2024-03','2024-04','2024-05','2024-06']
          assert manifest['start_inclusive'] == '2024-01-01T00:00:00+00:00'
          assert manifest['end_inclusive'] == '2024-06-30T23:55:00+00:00'
          assert len(manifest['archives']) == 30
          PY
      - name: Upload locked replay dataset
        uses: actions/upload-artifact@v4
        with:
          name: p8-locked-recognition-data-v1
          path: research_outputs/p7_full_recognition_data_v1/
          if-no-files-found: error
          retention-days: 90

  exact-replay-freeze:
    needs: acquire-fixed-data
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Download locked replay dataset
        uses: actions/download-artifact@v4
        with:
          name: p8-locked-recognition-data-v1
          path: research_outputs/p7_full_recognition_data_v1
      - name: Execute exact causal-vs-fast semantic replay
        run: python -u strategy_lab/p8_semantic_replay_freeze_v1.py
      - name: Verify exact zero-mismatch freeze report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('research_outputs/p8_semantic_replay_freeze_report_v1.json').read_text())
          freeze = json.loads(Path('research_outputs/p8_semantic_freeze_manifest_v1.json').read_text())
          assert report['p8_id'] == 'SMOKE_CORE_P8_SEMANTIC_REPLAY_FREEZE_FIXED_V1'
          assert report['status'] == 'PASS'
          assert report['equivalence']['mismatch_count'] == 0
          assert report['freeze_complete'] is True
          assert report['contract']['recognition_id'] == 'SMOKE_CORE_P7_FULL_RECOGNITION_FIXED_V1'
          assert report['contract']['fold_count'] == 10
          assert report['contract']['symbols'] == ['BTCUSDT','ETHUSDT','SOLUSDT','LINKUSDT','AAVEUSDT']
          assert report['contract']['directions'] == ['LONG','SHORT']
          assert report['contract']['global_fingerprint_dedupe'] is True
          assert freeze['missing_files'] == []
          assert freeze['hashed_file_count'] == freeze['required_file_count']
          forbidden = ('pnl','profit_factor','future_return','trade_outcome','mfe','mae','drawdown','equity','target_hit','stop_hit')
          raw = json.dumps({'report': report, 'freeze': freeze}, sort_keys=True).lower()
          assert not any(f'"{key}"' in raw for key in forbidden)
          PY
      - name: Upload P8 replay and freeze artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p8-semantic-replay-freeze-v1
          path: |
            research_outputs/p8_semantic_replay_freeze_report_v1.json
            research_outputs/p8_semantic_freeze_manifest_v1.json
          if-no-files-found: error
          retention-days: 90

  p1-p8-regression:
    needs: exact-replay-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Compile P1 through P8
        run: |
          python -m py_compile \
            strategy_lab/poi_imbalance_engine_v1.py \
            strategy_lab/context_liquidity_engine_v1.py \
            strategy_lab/interaction_engine_v1.py \
            strategy_lab/execution_structure_v1.py \
            strategy_lab/economics_risk_portfolio_v1.py \
            strategy_lab/scenario_fusion_v1.py \
            strategy_lab/outcome_blind_recognition_v1.py \
            strategy_lab/p7_full_recognition_runner_v1.py \
            strategy_lab/p8_semantic_replay_freeze_v1.py
      - name: Causal primitive regressions
        run: |
          python -u strategy_lab/mtf_dealing_range_v2_smoke_test.py
          python -u strategy_lab/period_liquidity_levels_smoke_test.py
      - name: P8 regression tests
        run: python -u strategy_lab/p8_semantic_replay_freeze_v1_smoke_test.py
      - name: P7 regression tests
        run: |
          python -u strategy_lab/outcome_blind_recognition_v1_smoke_test.py
          python -u strategy_lab/p7_full_recognition_runner_v1_smoke_test.py
      - name: P6 regression tests
        run: python -u strategy_lab/scenario_fusion_v1_smoke_test.py
      - name: P5 regression tests
        run: python -u strategy_lab/economics_risk_portfolio_v1_smoke_test.py
      - name: P4 regression tests
        run: |
          python -u strategy_lab/execution_structure_v1_smoke_test.py
          python -u strategy_lab/execution_family_policy_v1_smoke_test.py
      - name: P3 regression tests
        run: python -u strategy_lab/interaction_engine_v1_smoke_test.py
      - name: P2 regression tests
        run: python -u strategy_lab/context_liquidity_engine_v1_smoke_test.py
      - name: P1 regression tests
        run: python -u strategy_lab/poi_imbalance_engine_v1_smoke_test.py
