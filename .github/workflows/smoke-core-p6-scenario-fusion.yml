name: SMOKE CORE P6 Scenario Fusion

on:
  push:
    branches:
      - agent/smoke-core-1-p6-scenario-fusion
    paths:
      - 'strategy_lab/scenario_fusion_v1.py'
      - 'strategy_lab/scenario_fusion_v1_smoke_test.py'
      - 'research/SMOKE_CORE_P6_SCENARIO_FUSION_CONTRACT_V1.md'
      - '.github/workflows/smoke-core-p6-scenario-fusion.yml'
  pull_request:
    branches:
      - agent/smoke-core-1-p5-economics-risk-portfolio
    paths:
      - 'strategy_lab/scenario_fusion_v1.py'
      - 'strategy_lab/scenario_fusion_v1_smoke_test.py'
      - 'research/SMOKE_CORE_P6_SCENARIO_FUSION_CONTRACT_V1.md'
      - '.github/workflows/smoke-core-p6-scenario-fusion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Compile P1 through P6
        run: |
          python -m py_compile strategy_lab/poi_imbalance_engine_v1.py
          python -m py_compile strategy_lab/context_liquidity_engine_v1.py
          python -m py_compile strategy_lab/interaction_engine_v1.py
          python -m py_compile strategy_lab/execution_structure_v1.py
          python -m py_compile strategy_lab/execution_family_policy_v1.py
          python -m py_compile strategy_lab/economics_risk_portfolio_v1.py
          python -m py_compile strategy_lab/scenario_fusion_v1.py
      - name: P6 semantic tests
        run: python -m strategy_lab.scenario_fusion_v1_smoke_test
      - name: P5 regression tests
        run: python -m strategy_lab.economics_risk_portfolio_v1_smoke_test
      - name: P4 regressions
        run: |
          python -m strategy_lab.execution_structure_v1_smoke_test
          python -m strategy_lab.execution_family_policy_v1_smoke_test
      - name: P3 regression tests
        run: python -m strategy_lab.interaction_engine_v1_smoke_test
      - name: P2 regression tests
        run: python -m strategy_lab.context_liquidity_engine_v1_smoke_test
      - name: P1 regression tests
        run: python -m strategy_lab.poi_imbalance_engine_v1_smoke_test
      - name: Reused causal primitive tests
        run: |
          python -m strategy_lab.mtf_dealing_range_v2_smoke_test
          python -m strategy_lab.mtf_semantic_corrections_v2_smoke_test
      - name: P6 completeness frozen weights and no-outcome guard
        run: |
          grep -q '^class ScenarioFamily' strategy_lab/scenario_fusion_v1.py
          grep -q '^class ScenarioState' strategy_lab/scenario_fusion_v1.py
          grep -q '^def build_fingerprint' strategy_lab/scenario_fusion_v1.py
          grep -q '^def fuse_scenario' strategy_lab/scenario_fusion_v1.py
          grep -q '^def can_rearm' strategy_lab/scenario_fusion_v1.py
          grep -q '^def scenario_to_no_pnl_dict' strategy_lab/scenario_fusion_v1.py
          python - <<'PY'
          from strategy_lab.scenario_fusion_v1 import FAMILY_NODE_WEIGHTS, ScenarioFamily
          expected = {
              ScenarioFamily.LIQUIDITY_RAID_REVERSAL: [15,25,15,20,10,10,5],
              ScenarioFamily.TREND_PULLBACK_CONTINUATION: [20,25,10,15,15,10,5],
              ScenarioFamily.RANGE_BOUNDARY_ROTATION: [20,20,15,15,20,5,5],
          }
          for family, values in expected.items():
              assert list(FAMILY_NODE_WEIGHTS[family].values()) == values
              assert sum(values) == 100
          PY
