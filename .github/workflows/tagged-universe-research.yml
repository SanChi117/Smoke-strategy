name: Tagged Universe Research

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_triggers/tagged_universe_research.txt'
      - '.github/workflows/tagged-universe-research.yml'
      - 'strategy_lab/feature_builder.py'
      - 'strategy_lab/setup_generator.py'
      - 'scripts/**'
      - 'strategy_lab/universe/sector_groups.json'

concurrency:
  group: tagged-universe-research
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: '1'

jobs:
  tagged-universe-research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run tagged universe research suite
        run: |
          python scripts/run_tagged_universe_research_suite.py \
            --top-n-per-group 10 \
            --interval 15m \
            --limit 2500 \
            --windows 3 \
            --deep-limit 3500 \
            --deep-windows 4 \
            --deep-lookback-days 35 \
            --root results/tagged_universe_research \
            --layer-root results/strategy_universe_layer \
            --sleep-sec 0.02
          cat results/tagged_universe_research/tagged_decision/tagged_research_decision.md
          cat results/tagged_universe_research/paper_review/paper_review_plan.md
      - name: Upload tagged universe artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tagged-universe-research-results
          path: |
            results/strategy_universe_layer/**
            results/tagged_universe_research/**
