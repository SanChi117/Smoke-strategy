name: Discover Quick Sweep V2

on:
  push:
    branches:
      - 'agent/live-paper-hardening'
    paths:
      - 'research_triggers/discover_quick_sweep_v2.txt'

permissions:
  actions: read
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: a09983e5403e0e6f0a72c84633c968cff9b5b06b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-paper-hardening
          fetch-depth: 0

      - name: Find diagnostic quick sweep
        run: |
          RUN_ID="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow causal-quick-sweep.yml \
            --event push \
            --branch agent/live-paper-hardening \
            --limit 30 \
            --json databaseId,headSha \
            --jq '.[] | select(.headSha == env.TARGET_SHA) | .databaseId' \
            | head -n 1)"
          test -n "$RUN_ID"
          mkdir -p results/causal_quick_sweep_status_v4
          python - <<PY
          import json
          from pathlib import Path
          Path('results/causal_quick_sweep_status_v4/monitor.json').write_text(
              json.dumps({'source_head_sha':'$TARGET_SHA','run_id':int('$RUN_ID')}, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit run id
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin agent/live-paper-hardening
          git add results/causal_quick_sweep_status_v4/monitor.json
          git commit -m "Record diagnostic quick sweep run id" || exit 0
          git push origin HEAD:agent/live-paper-hardening
