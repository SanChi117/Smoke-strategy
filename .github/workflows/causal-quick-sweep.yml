name: Causal Quick Sweep

on:
  push:
    branches:
      - 'agent/live-paper-hardening'
    paths:
      - 'research_triggers/causal_quick_sweep_v1.txt'

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify strict OOS boundary
        run: |
          python -m strategy_lab.walk_forward_boundary_smoke_test
          python -m strategy_lab.portfolio_priority_smoke_test

      - name: Run quick causal sweep
        run: python scripts/run_causal_quick_sweep.py

      - name: Upload quick sweep
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-causal-quick-sweep-v1
          path: |
            results/causal_quick_sweep_v1/**
            results/causal_quick_sweep_universe_v1/**
