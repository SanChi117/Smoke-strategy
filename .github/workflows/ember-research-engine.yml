name: EMBER Research Engine CI

on:
  push:
    paths:
      - "ember-research-engine/**"
      - ".github/workflows/ember-research-engine.yml"
  pull_request:
    paths:
      - "ember-research-engine/**"
      - ".github/workflows/ember-research-engine.yml"

jobs:
  research-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: ember-research-engine

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ember-research-engine/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check ember/ tests/ scripts/
      - name: Tests
        run: pytest tests/ -v
      - name: Leakage gate
        run: pytest tests/test_no_leakage.py -v
