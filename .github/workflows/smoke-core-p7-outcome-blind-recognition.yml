name: SMOKE CORE P7 Outcome Blind Recognition

on:
  push:
    branches:
      - agent/smoke-core-1-p7-outcome-blind-recognition
    paths:
      - 'strategy_lab/outcome_blind_recognition_v1.py'
      - 'strategy_lab/outcome_blind_recognition_v1_smoke_test.py'
      - 'research/SMOKE_CORE_P7_OUTCOME_BLIND_RECOGNITION_PREREG_V1.md'
      - '.github/workflows/smoke-core-p7-outcome-blind-recognition.yml'
  pull_request:
    branches:
      - agent/smoke-core-1-p6-scenario-fusion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Compile P1 through P7
        run: |
          python -m py_compile \
            strategy_lab/poi_imbalance_engine_v1.py \
            strategy_lab/context_liquidity_engine_v1.py \
            strategy_lab/interaction_engine_v1.py \
            strategy_lab/execution_structure_v1.py \
            strategy_lab/economics_risk_portfolio_v1.py \
            strategy_lab/scenario_fusion_v1.py \
            strategy_lab/outcome_blind_recognition_v1.py
      - name: Reused causal primitive tests
        run: |
          python -m unittest -v \
            strategy_lab.mtf_dealing_range_v2_smoke_test \
            strategy_lab.period_liquidity_levels_smoke_test
      - name: P7 outcome-blind semantic tests
        run: python strategy_lab/outcome_blind_recognition_v1_smoke_test.py
      - name: P6 regression tests
        run: python strategy_lab/scenario_fusion_v1_smoke_test.py
      - name: P5 regression tests
        run: python strategy_lab/economics_risk_portfolio_v1_smoke_test.py
      - name: P4 regression tests
        run: |
          python strategy_lab/execution_structure_v1_smoke_test.py
          python strategy_lab/execution_family_policy_v1_smoke_test.py
      - name: P3 regression tests
        run: python strategy_lab/interaction_engine_v1_smoke_test.py
      - name: P2 regression tests
        run: python strategy_lab/context_liquidity_engine_v1_smoke_test.py
      - name: P1 regression tests
        run: python strategy_lab/poi_imbalance_engine_v1_smoke_test.py
      - name: P7 preregistration and no-outcome guard
        shell: bash
        run: |
          set -euo pipefail
          test -s research/SMOKE_CORE_P7_OUTCOME_BLIND_RECOGNITION_PREREG_V1.md
          grep -q 'at least 60 independent' research/SMOKE_CORE_P7_OUTCOME_BLIND_RECOGNITION_PREREG_V1.md
          grep -q 'exactly 10 chronological folds' research/SMOKE_CORE_P7_OUTCOME_BLIND_RECOGNITION_PREREG_V1.md
          grep -q 'BTCUSDT' research/SMOKE_CORE_P7_OUTCOME_BLIND_RECOGNITION_PREREG_V1.md
          grep -q 'AAVEUSDT' research/SMOKE_CORE_P7_OUTCOME_BLIND_RECOGNITION_PREREG_V1.md
          python - <<'PY'
          from dataclasses import fields
          from strategy_lab.outcome_blind_recognition_v1 import RecognitionObservation, PilotReport, RecognitionReport
          forbidden = ('pnl','future_return','trade_outcome','mfe','mae','profit_factor','drawdown','exit_price','exit_reason','equity')
          for cls in (RecognitionObservation, PilotReport, RecognitionReport):
              names = [f.name.lower() for f in fields(cls)]
              assert not any(any(x in name for x in forbidden) for name in names), (cls.__name__, names)
          PY
