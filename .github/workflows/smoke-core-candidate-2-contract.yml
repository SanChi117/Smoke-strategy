name: SMOKE CORE Candidate 2 Contract

on:
  pull_request:
    branches:
      - agent/smoke-core-1-p8-semantic-freeze
    paths:
      - 'research/SMOKE_CORE_CANDIDATE_2_RESEARCH_SPEC_V1.md'
      - 'strategy_lab/candidate_2_hypothesis_contract_v1.py'
      - 'strategy_lab/candidate_2_hypothesis_contract_v1_smoke_test.py'
      - 'strategy_lab/candidate_2_regime_engine_v1.py'
      - 'strategy_lab/candidate_2_acceptance_engine_v1.py'
      - 'strategy_lab/candidate_2_target_reachability_v1.py'
      - 'strategy_lab/candidate_2_causal_engines_v1_smoke_test.py'
      - '.github/workflows/smoke-core-candidate-2-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-2-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Validate research specification
        shell: bash
        run: |
          set -euo pipefail
          P=research/SMOKE_CORE_CANDIDATE_2_RESEARCH_SPEC_V1.md
          test -s "$P"
          grep -q 'Candidate 2' "$P"
          grep -q 'Regime State Engine' "$P"
          grep -q 'Attainable Target Engine' "$P"
          grep -q 'Acceptance / Persistence Engine' "$P"
          grep -q 'не могут быть единственным authoritative profitability' "$P"
      - name: Compile Candidate 2 contracts and causal engines
        run: |
          python -m py_compile \
            strategy_lab/candidate_2_hypothesis_contract_v1.py \
            strategy_lab/candidate_2_hypothesis_contract_v1_smoke_test.py \
            strategy_lab/candidate_2_regime_engine_v1.py \
            strategy_lab/candidate_2_acceptance_engine_v1.py \
            strategy_lab/candidate_2_target_reachability_v1.py \
            strategy_lab/candidate_2_causal_engines_v1_smoke_test.py
      - name: Run Candidate 2 contract smoke tests
        run: python -u strategy_lab/candidate_2_hypothesis_contract_v1_smoke_test.py
      - name: Run Candidate 2 causal engine smoke tests
        run: python -u strategy_lab/candidate_2_causal_engines_v1_smoke_test.py
      - name: Regression compile frozen P1-P8 transports
        run: |
          python -m py_compile \
            strategy_lab/poi_imbalance_engine_v1.py \
            strategy_lab/context_liquidity_engine_v1.py \
            strategy_lab/interaction_engine_v1.py \
            strategy_lab/execution_structure_v1.py \
            strategy_lab/economics_risk_portfolio_v1.py \
            strategy_lab/scenario_fusion_v1.py \
            strategy_lab/outcome_blind_recognition_v1.py \
            strategy_lab/p7_full_recognition_runner_v1.py \
            strategy_lab/p8_semantic_replay_freeze_v1.py
