name: Causal Long History Balanced

on:
  push:
    branches:
      - 'agent/live-paper-hardening'
    paths:
      - 'research_triggers/causal_long_history_balanced_v1.txt'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  balanced-wfo:
    name: balanced-resumption-six-month-wfo
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-paper-hardening
          fetch-depth: 0

      - name: Record running id
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/live-paper-hardening
          mkdir -p results/causal_long_history_balanced_status_v1
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('results/causal_long_history_balanced_status_v1/monitor.json').write_text(
              json.dumps({
                  'source_head_sha': os.environ['GITHUB_SHA'],
                  'run_id': int(os.environ['GITHUB_RUN_ID']),
                  'status': 'running',
                  'candidate': 'LONGHIST_RESUMPTION_BALANCED_V1',
                  'data_source': 'BINANCE_VISION_USDM_FUTURES_ARCHIVE',
              }, indent=2) + '\n', encoding='utf-8')
          PY
          git add results/causal_long_history_balanced_status_v1/monitor.json
          git commit -m 'Record running balanced causal WFO id' || true
          git push origin HEAD:agent/live-paper-hardening

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m strategy_lab.causal_history_fast_smoke_test
          python -m strategy_lab.binance_vision_download_smoke_test
          python -m strategy_lab.binance_vision_archive_smoke_test
          python -m strategy_lab.walk_forward_boundary_smoke_test

      - name: Build universe and dates
        id: dates
        run: |
          python scripts/build_strategy_universe_layer.py \
            --top-n-per-group 3 \
            --out-dir results/causal_long_history_balanced_universe_v1
          echo "start_date=$(date -u -d '210 days ago' +%F)" >> "$GITHUB_OUTPUT"
          echo "end_date=$(date -u -d '1 day ago' +%F)" >> "$GITHUB_OUTPUT"

      - name: Download official futures archives
        run: |
          python scripts/download_binance_vision_futures_archives.py \
            --symbols-file results/causal_long_history_balanced_universe_v1/combined_symbols.txt \
            --interval 15m \
            --start-date '${{ steps.dates.outputs.start_date }}' \
            --end-date '${{ steps.dates.outputs.end_date }}' \
            --out-dir "$RUNNER_TEMP/binance-vision-usdm" \
            --summary-json results/causal_long_history_balanced_v1/archive_download_summary.json \
            --workers 8 --retries 2 --timeout 30

      - name: Merge closed futures candles
        run: |
          python scripts/merge_binance_vision_futures_klines.py \
            --input-dir "$RUNNER_TEMP/binance-vision-usdm" \
            --out "$RUNNER_TEMP/smoke-usdm-15m.csv" \
            --symbols-file results/causal_long_history_balanced_universe_v1/combined_symbols.txt \
            --interval 15m \
            --start-date '${{ steps.dates.outputs.start_date }}' \
            --end-date '${{ steps.dates.outputs.end_date }}' \
            --summary-json results/causal_long_history_balanced_v1/archive_merge_summary.json \
            --min-coverage 0.75

      - name: Run focused balanced WFO
        env:
          SMOKE_LONG_CANDLES_SOURCE: ${{ runner.temp }}/smoke-usdm-15m.csv
        run: |
          python scripts/run_causal_long_history_balanced.py \
            --symbols-file results/causal_long_history_balanced_universe_v1/combined_symbols.txt \
            --out-dir results/causal_long_history_balanced_v1 \
            --interval 15m --limit 18000 --windows 6 --lookback-days 30 \
            --profile research_500 --pool-min-confidence 40 --sleep-sec 0

      - name: Upload focused audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-causal-long-history-balanced-v1
          path: |
            results/causal_long_history_balanced_v1/result.json
            results/causal_long_history_balanced_v1/result.md
            results/causal_long_history_balanced_v1/long_wfo_summary.csv
            results/causal_long_history_balanced_v1/fold_index.csv
            results/causal_long_history_balanced_v1/candidate_folds/**
            results/causal_long_history_balanced_v1/archive_*_summary.json
            results/causal_long_history_balanced_universe_v1/combined_symbols.txt
          if-no-files-found: warn

      - name: Commit result and final status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/live-paper-hardening
          mkdir -p results/causal_long_history_balanced_status_v1
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('results/causal_long_history_balanced_status_v1/monitor.json').write_text(
              json.dumps({
                  'source_head_sha': os.environ['GITHUB_SHA'],
                  'run_id': int(os.environ['GITHUB_RUN_ID']),
                  'status': '${{ job.status }}',
                  'candidate': 'LONGHIST_RESUMPTION_BALANCED_V1',
                  'data_source': 'BINANCE_VISION_USDM_FUTURES_ARCHIVE',
              }, indent=2) + '\n', encoding='utf-8')
          PY
          git add results/causal_long_history_balanced_status_v1/monitor.json
          if [ -f results/causal_long_history_balanced_v1/result.json ]; then
            git add results/causal_long_history_balanced_v1 results/causal_long_history_balanced_universe_v1
          fi
          git commit -m 'Record focused balanced causal WFO result' || exit 0
          git push origin HEAD:agent/live-paper-hardening
