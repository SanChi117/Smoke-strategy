name: Causal External Holdout

on:
  push:
    branches:
      - 'agent/live-paper-hardening'
    paths:
      - 'research_triggers/causal_external_holdout_v1.txt'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  frozen-holdout:
    name: frozen-2025-external-holdout
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout frozen branch
        uses: actions/checkout@v4
        with:
          ref: agent/live-paper-hardening

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify causal invariants
        run: |
          python -m strategy_lab.causal_history_smoke_test
          python -m strategy_lab.closed_context_smoke_test
          python -m strategy_lab.walk_forward_boundary_smoke_test
          python -m strategy_lab.research_metrics_smoke_test

      - name: Build independent research universe
        run: |
          python scripts/build_strategy_universe_layer.py \
            --top-n-per-group 3 \
            --out-dir results/causal_external_holdout_universe_v1

      - name: Download fixed Binance Vision holdout
        run: |
          python scripts/download_binance_vision_futures_archives.py \
            --symbols-file results/causal_external_holdout_universe_v1/combined_symbols.txt \
            --interval 15m \
            --start-date '2025-07-01' \
            --end-date '2025-12-31' \
            --out-dir "$RUNNER_TEMP/binance-vision-external-usdm" \
            --summary-json results/causal_external_holdout_v1/archive_download_summary.json \
            --workers 8 \
            --retries 2 \
            --timeout 30

      - name: Merge fixed closed holdout candles
        run: |
          python scripts/merge_binance_vision_futures_klines.py \
            --input-dir "$RUNNER_TEMP/binance-vision-external-usdm" \
            --out "$RUNNER_TEMP/smoke-external-usdm-15m.csv" \
            --symbols-file results/causal_external_holdout_universe_v1/combined_symbols.txt \
            --interval 15m \
            --start-date '2025-07-01' \
            --end-date '2025-12-31' \
            --summary-json results/causal_external_holdout_v1/archive_merge_summary.json \
            --min-coverage 0.70

      - name: Validate one frozen baseline only
        run: |
          python scripts/run_frozen_external_holdout.py \
            --candles "$RUNNER_TEMP/smoke-external-usdm-15m.csv" \
            --baseline configs/frozen_external_holdout_v1.json \
            --out-dir results/causal_external_holdout_v1 \
            --windows 6 \
            --lookback-days 30 \
            --profile research_500 \
            --pool-min-confidence 40

      - name: Upload external holdout audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-causal-external-holdout-v1
          path: |
            results/causal_external_holdout_v1/result.json
            results/causal_external_holdout_v1/fold_summary.csv
            results/causal_external_holdout_v1/archive_download_summary.json
            results/causal_external_holdout_v1/archive_merge_summary.json
            results/causal_external_holdout_universe_v1/combined_symbols.txt
